name: REX D2 prettier sync

on:
  push:
    branches:
      - gm-dmaic-rex-d2-prettier-20260926
    paths:
      - '.github/workflows/rex-d2-prettier-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format only the observed D2 file
        run: npx prettier --config ./.prettierrc.js --write .github/workflows/update-config-files.yml

      - name: Commit formatting and remove temporary helper
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-config-files.yml
          git rm .github/workflows/rex-d2-prettier-sync.yml
          git commit -m "GM DMAIC REX D2: normalize workflow formatting"
          git push origin "HEAD:${BRANCH}"
