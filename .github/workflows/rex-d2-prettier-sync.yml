name: REX D2 prettier export

on:
  push:
    branches:
      - gm-dmaic-rex-d2-prettier-20260926
    paths:
      - '.github/workflows/rex-d2-prettier-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format only the observed D2 file
        run: npx prettier --config ./.prettierrc.js --write .github/workflows/update-config-files.yml

      - name: Upload formatted workflow
        uses: actions/upload-artifact@v4
        with:
          name: rex-d2-prettier-output
          path: .github/workflows/update-config-files.yml
          if-no-files-found: error
