name: REX D3 dist sync

on:
  push:
    branches:
      - gm-dmaic-rex-d3-time-boundary-20260926
    paths:
      - '.github/workflows/rex-d3-dist-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild dist from D3 source
        run: npm run build

      - name: Commit generated dist and remove helper
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git rm .github/workflows/rex-d3-dist-sync.yml
          if git diff --cached --quiet; then
            echo "No generated dist delta to commit"
          else
            git commit -m "GM DMAIC REX D3: synchronize generated dist"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Dispatch exact-head check-dist proof
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run check-dist.yml --ref "${BRANCH}"
