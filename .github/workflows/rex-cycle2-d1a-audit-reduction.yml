name: REX cycle2 D1A audit reduction

on:
  push:
    branches:
      - gm-dmaic-rex-cycle2-d1a-audit-reduction-20260926
    paths:
      - '.github/workflows/rex-cycle2-d1a-audit-reduction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install exact baseline
        run: npm ci --ignore-scripts

      - name: Apply non-breaking audit fix
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Reinstall repaired lock state
        run: npm ci --ignore-scripts

      - name: Format check
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Build regenerated dist
        run: npm run build

      - name: Test
        run: npm test

      - name: Capture and assert reduced audit state
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const v = report.metadata && report.metadata.vulnerabilities;
          if (!v) throw new Error('audit metadata missing');
          console.log(JSON.stringify(v));
          if (v.critical !== 0) throw new Error('critical vulnerabilities remain');
          if (v.total > 6) throw new Error('non-breaking repair regressed above analyzed total=6');
          NODE

      - name: Commit lockfile, dist, and remove helper
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist/index.js
          git rm .github/workflows/rex-cycle2-d1a-audit-reduction.yml
          git commit -m "GM DMAIC REX cycle2 D1A: reduce non-breaking audit debt"
          git push origin "HEAD:${BRANCH}"
