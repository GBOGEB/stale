name: REX D3 closeout sync

on:
  push:
    branches:
      - gm-dmaic-rex-d3-closeout-20260926
    paths:
      - '.github/workflows/rex-d3-closeout-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild dist from merged D3 source
        run: npm run build

      - name: Commit dist and remove temporary helpers
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git rm -f .github/workflows/rex-d3-dist-sync.yml
          git rm -f .github/workflows/rex-d3-closeout-sync.yml
          git commit -m "GM DMAIC REX D3: close generated artifact loop"
          git push origin "HEAD:${BRANCH}"

      - name: Dispatch exact-head check-dist proof
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run check-dist.yml --ref "${BRANCH}"
