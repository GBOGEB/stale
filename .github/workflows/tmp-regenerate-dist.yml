name: Temporary exact-head dist regeneration
on:
  push:
    branches:
      - gm-actions-github-v7-security-20260929
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gm-actions-github-v7-security-20260929
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated dist only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerate dist from proven dependency graph"
          git push origin HEAD:gm-actions-github-v7-security-20260929
