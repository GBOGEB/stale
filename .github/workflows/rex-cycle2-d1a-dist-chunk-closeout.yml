name: REX cycle2 D1A dist chunk closeout

on:
  push:
    branches:
      - gm-dmaic-rex-cycle2-d1a-dist-chunk-closeout-20260926
    paths:
      - '.github/workflows/rex-cycle2-d1a-dist-chunk-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install exact merged lock state
        run: npm ci --ignore-scripts

      - name: Rebuild complete dist output
        run: npm run build

      - name: Commit all dist outputs and remove helper
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git rm .github/workflows/rex-cycle2-d1a-dist-chunk-closeout.yml
          git commit -m "GM DMAIC REX cycle2 D1A: include generated dist chunks"
          git push origin "HEAD:${BRANCH}"
